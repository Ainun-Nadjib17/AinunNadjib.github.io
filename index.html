
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terminal Intro</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        background:#000;
        color:#00ff41;
        font-family: "Courier New", monospace;
        overflow:hidden;
    }

    #terminal{
        padding:20px;
        height:100vh;
        overflow-y:auto;
        white-space:pre-wrap;
        font-size:18px;
    }

    .cursor{
        display:inline-block;
        width:10px;
        height:20px;
        background:#00ff41;
        animation:blink 0.8s infinite;
    }

    @keyframes blink{
        50%{
            opacity:0;
        }
    }

    .red{
        color:#ff3030;
        font-weight:bold;
        text-shadow:0 0 10px #ff3030;
    }

    .yellow{
        color:#ffd700;
    }

    .blue{
        color:#66ccff;
    }

    .success{
        color:#00ff41;
    }

    /* Progress Bar */
    #progressContainer{
        display:none;
        margin-top:10px;
        width:400px;
        max-width:90%;
        border:1px solid #00ff41;
        height:24px;
    }

    #progressBar{
        width:0%;
        height:100%;
        background:#00ff41;
        transition:width .08s linear;
    }

    /* Glitch */
    .glitch{
        animation:glitch .15s infinite;
    }

    @keyframes glitch{
        0%{
            transform:translate(0);
            filter:hue-rotate(0deg);
        }
        25%{
            transform:translate(-4px,2px);
            filter:hue-rotate(90deg);
        }
        50%{
            transform:translate(4px,-2px);
            filter:hue-rotate(180deg);
        }
        75%{
            transform:translate(-2px,-4px);
            filter:hue-rotate(270deg);
        }
        100%{
            transform:translate(0);
            filter:hue-rotate(360deg);
        }
    }
</style>
</head>
<body>

<div id="terminal">
    <span class="cursor"></span>

    <div id="progressContainer">
        <div id="progressBar"></div>
    </div>
</div>

<script>
const terminal = document.getElementById("terminal");
const progressContainer = document.getElementById("progressContainer");
const progressBar = document.getElementById("progressBar");

const lines = [
    "[BOOT] Initializing secure connection...",
    "[OK] Loading exploit modules...",
    "",
    "root@kali:~$ nmap portfolio.local",
    "Scanning ports...",
    "22/tcp   open   ssh",
    "80/tcp   open   http",
    "443/tcp  open   https",
    "",
    "root@kali:~$ ssh admin@portfolio.local",
    "Attempting authentication...",
    "",
    "Bypassing firewall...",
    "Injecting payload...",
    "Escalating privileges..."
];

let lineIndex = 0;
let charIndex = 0;

let audioUnlocked = false;

/* ===== KEYBOARD SOUND ===== */
function unlockAudio(){
    if(audioUnlocked) return;

    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    window.audioCtx = ctx;
    audioUnlocked = true;
}

document.addEventListener("click", unlockAudio, { once:true });

function playKeySound(){
    if(!window.audioCtx) return;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = "square";
    osc.frequency.value = 900;

    gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioCtx.currentTime + 0.03
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.03);
}

/* ===== TYPE EFFECT ===== */
function typeLine(){

    if(lineIndex >= lines.length){
        startProgress();
        return;
    }

    const currentLine = lines[lineIndex];

    if(charIndex === 0){

        const div = document.createElement("div");

        if(currentLine.startsWith("[BOOT]")){
            div.className = "blue";
        }
        else if(currentLine.startsWith("[OK]")){
            div.className = "success";
        }

        terminal.insertBefore(div, progressContainer);
    }

    const currentDiv =
        terminal.children[terminal.children.length - 3];

    if(charIndex < currentLine.length){

        currentDiv.textContent += currentLine.charAt(charIndex);

        playKeySound();

        charIndex++;

        terminal.scrollTop = terminal.scrollHeight;

        setTimeout(typeLine, 30);

    }else{

        charIndex = 0;
        lineIndex++;

        setTimeout(typeLine, 250);
    }
}

/* ===== PROGRESS BAR ===== */
function startProgress(){

    const text = document.createElement("div");
    text.textContent = "Decrypting secure data...";
    terminal.insertBefore(text, progressContainer);

    progressContainer.style.display = "block";

    let progress = 0;

    const interval = setInterval(()=>{

        progress++;

        progressBar.style.width = progress + "%";

        terminal.scrollTop = terminal.scrollHeight;

        if(progress >= 100){

            clearInterval(interval);

            showDenied();
        }

    }, 35);
}

/* ===== ACCESS DENIED ===== */
function showDenied(){

    const denied = document.createElement("div");

    denied.className = "red";

    denied.textContent = "ACCESS DENIED";

    terminal.insertBefore(denied, progressContainer);

    const reason = document.createElement("div");

    reason.textContent =
        "Security system detected unauthorized access.";

    terminal.insertBefore(reason, progressContainer);

    setTimeout(startGlitch, 1200);
}

/* ===== GLITCH ===== */
function startGlitch(){

    document.body.classList.add("glitch");

    setTimeout(()=>{

        document.body.classList.remove("glitch");

        const redirect = document.createElement("div");

        redirect.className = "yellow";

        redirect.textContent =
            "Redirecting to portfolio...";

        terminal.insertBefore(redirect, progressContainer);

        setTimeout(()=>{

            // GANTI dengan halaman portofolio kamu
            window.location.href = "portofolio.html";

        }, 2000);

    }, 1500);
}

typeLine();
</script>

</body>
</html>
