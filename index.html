<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terminal Intro</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
    *{ margin:0; padding:0; box-sizing:border-box; }

    body{
        background:#0a0a0a;
        color:#00ff41;
        font-family: 'JetBrains Mono', monospace;
        overflow:hidden;
        text-shadow: 0 0 4px rgba(0, 255, 65, 0.4);
    }

    #matrixCanvas {
        position: fixed; top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 0; opacity: 0.12;
        pointer-events: none;
    }

    #terminal{
        position: relative; z-index: 1;
        padding: 20px;
        height: 100vh;
        overflow-y: auto;
        white-space: pre-wrap;
        word-wrap: break-word;
        font-size: 16px;
        line-height: 1.5;
    }

    #terminal::-webkit-scrollbar { width: 8px; }
    #terminal::-webkit-scrollbar-track { background: #0a0a0a; }
    #terminal::-webkit-scrollbar-thumb { background: #00ff41; border-radius: 4px; }

    .blue{ color:#66ccff; }
    .success{ color:#00ff41; }
    .yellow{ color:#ffd700; }
    .white{ color:#ffffff; }

    .approved{
        color:#00ff41; font-weight:bold;
        text-shadow:0 0 15px #00ff41;
        font-size: 20px; margin: 10px 0;
    }

    #progressContainer{
        display:none;
        margin: 15px 0;
        width:400px; max-width:90%;
        border:1px solid #00ff41;
        height:20px; border-radius: 3px;
        overflow: hidden;
    }

    #progressBar{
        width:0%; height:100%;
        background: #00ff41;
        box-shadow: 0 0 10px #00ff41;
        transition:width .08s linear;
    }

    .glitch{ animation:glitch .15s infinite; }

    @keyframes glitch{
        0%{ transform:translate(0); filter:hue-rotate(0deg); }
        25%{ transform:translate(-3px,2px); filter:hue-rotate(90deg); }
        50%{ transform:translate(3px,-2px); filter:hue-rotate(180deg); }
        75%{ transform:translate(-2px,-3px); filter:hue-rotate(270deg); }
        100%{ transform:translate(0); filter:hue-rotate(360deg); }
    }

    .ascii-art {
        color: #00ff41;
        font-size: 10px;
        line-height: 1;
        margin: 15px 0;
        text-shadow: 0 0 8px #00ff41;
        animation: asciiGlow 2s ease-in-out infinite;
    }

    @keyframes asciiGlow {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; }
    }

    .redirect-msg {
        color: #ffd700;
        font-size: 18px;
        margin-top: 20px;
        animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
    }
</style>
</head>
<body>

<canvas id="matrixCanvas"></canvas>

<div id="terminal">
    <div id="boot-sequence"></div>
    <div id="progressContainer">
        <div id="progressBar"></div>
    </div>
</div>

<script>
const terminal = document.getElementById("terminal");
const bootSequence = document.getElementById("boot-sequence");
const progressContainer = document.getElementById("progressContainer");
const progressBar = document.getElementById("progressBar");

const lines = [
    "[ROOT] Initializing system...",
    "[ROOT] Loading kernel modules...",
    "[ROOT] Establishing secure connection...",
    "",
    "root@kali:~$ identity_scan --full",
    "Scanning biometric data...",
    "Analyzing fingerprint...",
    "Verifying security clearance...",
    "",
    "[ROOT] Identity confirmed: Admin Level 5",
    "[ROOT] All security protocols satisfied",
    "",
    "root@kali:~$ access_request --level=highest",
    "Processing authorization...",
    "Validating credentials...",
    "Granting system access..."
];

let lineIndex = 0, charIndex = 0;

/* ===== MATRIX RAIN ===== */
const canvas = document.getElementById('matrixCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*';
const fontSize = 14;
const columns = canvas.width / fontSize;
const drops = Array(Math.floor(columns)).fill(1);

function drawMatrix() {
    ctx.fillStyle = 'rgba(10, 10, 10, 0.05)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00ff41';
    ctx.font = fontSize + 'px JetBrains Mono';
    for(let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if(drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
    }
}
setInterval(drawMatrix, 33);
window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

/* ===== TYPE EFFECT ===== */
function typeLine(){
    if(lineIndex >= lines.length){ startProgress(); return; }
    const currentLine = lines[lineIndex];
    if(charIndex === 0){
        const div = document.createElement("div");
        if(currentLine.startsWith("[ROOT]")) div.className = "blue";
        else if(currentLine.startsWith("[OK]")) div.className = "success";
        bootSequence.appendChild(div);
    }
    const currentDiv = bootSequence.lastElementChild;
    if(charIndex < currentLine.length){
        currentDiv.textContent += currentLine.charAt(charIndex);
        charIndex++;
        terminal.scrollTop = terminal.scrollHeight;
        setTimeout(typeLine, 25);
    } else {
        charIndex = 0;
        lineIndex++;
        setTimeout(typeLine, 150);
    }
}

/* ===== PROGRESS BAR ===== */
function startProgress(){
    const text = document.createElement("div");
    text.textContent = "Decrypting secure data...";
    text.style.marginBottom = "5px";
    bootSequence.appendChild(text);

    progressContainer.style.display = "block";
    let progress = 0;
    const interval = setInterval(()=>{
        progress++;
        progressBar.style.width = progress + "%";
        terminal.scrollTop = terminal.scrollHeight;
        if(progress >= 100){
            clearInterval(interval);
            setTimeout(showApproved, 300);
        }
    }, 30);
}

/* ===== ACCESS APPROVED ===== */
function showApproved(){
    const approved = document.createElement("div");
    approved.className = "approved";
    approved.textContent = "[✓] ACCESS APPROVED";
    bootSequence.appendChild(approved);

    const welcome = document.createElement("div");
    welcome.className = "white";
    welcome.textContent = "Welcome, root. All systems are operational.";
    welcome.style.marginBottom = "15px";
    bootSequence.appendChild(welcome);

    setTimeout(showIdentity, 800);
}

/* ===== IDENTITY REVEAL ===== */
function showIdentity() {
    const ascii = document.createElement("pre");
    ascii.className = "ascii-art";
    ascii.textContent = `
  ██████╗  ██████╗ ███╗   ██╗███████╗██╗ ██████╗ 
 ██╔════╝ ██╔═══██╗████╗  ██║██╔════╝██║██╔════╝ 
 ██║      ██║   ██║██╔██╗ ██║█████╗  ██║██║  ███╗ 
 ██║      ██║   ██║██║╚██╗██║██╔══╝  ██║██║   ██║ 
 ╚██████╗ ╚██████╔╝██║ ╚████║██║     ██║╚██████╔╝ 
  ╚═════╝  ╚═════╝ ╚═╝  ╚═══╝╚═╝     ╚═╝ ╚═════╝ `;
    bootSequence.appendChild(ascii);

    const intro = document.createElement("div");
    intro.className = "white";
    intro.textContent = "> Full Stack Developer | Security Enthusiast";
    intro.style.marginBottom = "20px";
    bootSequence.appendChild(intro);

    setTimeout(startGlitch, 1500);
}

/* ===== GLITCH + REDIRECT ===== */
function startGlitch(){
    document.body.classList.add("glitch");
    
    setTimeout(()=>{
        document.body.classList.remove("glitch");
        
        const redirectMsg = document.createElement("div");
        redirectMsg.className = "redirect-msg";
        redirectMsg.textContent = "[⟳] Redirecting to portfolio...";
        bootSequence.appendChild(redirectMsg);
        
        terminal.scrollTop = terminal.scrollHeight;
        
        // Redirect setelah 2 detik
        setTimeout(() => {
            window.location.href = "portofolio.html";
        }, 2000);
        
    }, 1000);
}

// Mulai animasi
typeLine();
</script>

</body>
   </html>
